model:
  name: vbsr
  num_classes: 12
  imgH: 144
  imgW: 144
  imgKar: True # Keep Aspect Ratio
  chroma: rgb # lxy, rgb, gray...
  normalize: [[127.5, 127.5, 127.5], [127.5, 127.5, 127.5]] # [mean, std]
  feat_separator: 
    enabled: False
    margin: 0.25
    scale: 30.0
    dropout: 0.2
  projection:
    fully_connected: False
    hidden_channels: 80 # ([this > num_classes] && [this * (1 - dropout) ~= num_classes])
    dropout: 0.8
    activation: "Hardswish"
  backbone:
    type: 'mnv3' # 'resnet' or 'mnv4' or 'mnv3' or 'mobilevitv3_v1' 'mobilevitv3_v2', or 'vgg' or 'colornet'
    ResNet:
      input_channels: 3
      width_mult: 0.5
      out_stage: 4 # [1,4]
      activation: ReLU # ReLU, LeakyReLU, GELU, SiLU, Hardswish, Tanh, Identity
    MobileNetV4:
      input_channels: 3
      block_size: "medium" # small, medium, large
      width_mult: 1.0
      out_stage: 5
      activation: "ReLU"
    MobileNetV3:
      in_chans: 3
      channel_multiplier: 1.0
      block_size: "large"
    MobileViTv3_v1:
      input_channels: 3
      mode: "small"
      patch_size: [2, 2]
    MobileViTv3_v2:
      input_channels: 3
      width_mult: 1.0
      out_stage: 5 # [1,5]
      patch_size: [2, 2]
    Vgg:
      input_channels: 3
      activation: "ReLU"
    ColorNet:
      input_channels: 3
      activation: "ReLU"

datasets:
  train: /home/projects/urban-watch/klass/datasets/vbsr/imgs_train
  val: /home/projects/urban-watch/klass/datasets/vbsr/imgs_val
  calib: /home/projects/urban-watch/klass/datasets/vbsr/calibration

train:
  batch_size: 32 #500
  workers: -1 # number of data loading workers
  epochs: 300000 # number of epochs to train for
  grad_clip: 5.0
  l2_lambda: 1.0e-3 # L2 regul (0 to disable)
  loss: # focal loss
    alpha: 0.25
    gamma: 2.0
    label_smoothing: 0.0
  lr_scheduler:
    name: ExponentialLR
    patience: 3
    ExponentialLR:
      gamma: 0.94
    StepLR:
      gamma: 0.94
      step_size: 1
  optimizer: 
    name: Adagrad
    Adadelta:
      lr: 1.0e-0
      rho: 0.95
    Adam:
      lr: 1.0e-3
      betas: [0.9, 0.999]
    AdamW:
      lr: 1.0e-3
      betas: [0.9, 0.999]
      amsgrad: False
      weight_decay: 1.0e-2
    SGD:
      lr: 1.0e-3
      momentum: 0.9
      nesterov: False
      weight_decay: 0
    RMSprop:
      lr: 1.0e-3
      momentum: 0.9
      weight_decay: 1.0e-2
    Adagrad:
      lr: 1.0e-3


augment:
  enabled: True
  warp:
    perspective: 0.0 # factor
    scale: [1.0, 1.0] # ratio, e.g. [0.6, 1.4]
    stretch: [[1.0, 1.0], [1.0, 1.0]] # ratio, e.g. [0.6, 1.4]
    rotation: 10.0 # degrees
    shear: [10.0, 10.0] # degrees
    translate: 0.1 # ratio
    flip: 0.5 # probability
    crop: 0.1 # ratio
    border_reflect: False
  texture:
    per_channel: True
    grayscale: 0.5 # probability
    average_blur: [3, 9]
    gaussian_blur: [0.0, 3.0]
    motion_blur: [15, -45, 45]
    multiply: [0.5, 1.5]
    multiply_hue: [0.5, 1.5]
    multiply_saturation: [0.5, 1.5]
    gamma_contrast: [0.5, 2.0]
    sigmoid_contrast: [3, 10, 0.4, 0.6]
    log_contrast: [0.6, 1.4]
    linear_contrast: [0.5, 1.5]
    emboss: [0, 1.0, 0, 2.0]
    additive_gaussian_noise: 10.0
    salt: 0.02
    pepper: 0.02