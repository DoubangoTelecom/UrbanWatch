model:
  name: vcr
  num_classes: 13
  imgH: 128
  imgW: 128
  imgKar: False # Keep Aspect Ratio
  chroma: rgb # lxy, rgb, gray...
  normalize: [[0.0, 0.0, 0.0], [255.0, 255.0, 255.0]] # [mean, std]
  feat_separator: 
    enabled: True
    margin: 0.25
    scale: 30.0
  projection:
    fully_connected: False
    hidden_channels: 1280
    dropout: 0.2
    activation: "ReLU"
  backbone:
    type: 'colornet' # 'resnet' or 'mnv4' or 'mnv3' or 'mobilevitv3_v1' 'mobilevitv3_v2', or 'vgg' or 'colornet'
    ResNet:
      input_channels: 4
      width_mult: 1.0
      out_stage: 3 # [1,4]
      activation: ReLU # ReLU, LeakyReLU, GELU, SiLU, Hardswish, Tanh, Identity
    MobileNetV4:
      input_channels: 3 # split(rgb), then stack
      block_size: "small" # small, medium, large
      width_mult: 1.0
      out_stage: 5 # [1,5]
      activation: "ReLU"
    MobileNetV3:
      input_channels: 3
      block_size: "large"
    MobileViTv3_v1:
      input_channels: 3
      mode: "small"
      patch_size: [2, 2]
    MobileViTv3_v2:
      input_channels: 3
      width_mult: 1.0
      out_stage: 3 # [1,5]
      patch_size: [2, 2]
    Vgg:
      input_channels: 3
      activation: "ReLU"
    ColorNet:
      input_channels: 3 # must be 3
      width_mult: 1.0
      out_stage: 2 # [1,4]
      activation: "ReLU"

datasets:
  train: /home/projects/urban-watch/klass/datasets/vcr/imgs_train
  val: /home/projects/urban-watch/klass/datasets/vcr/imgs_val
  calib: /home/projects/urban-watch/klass/datasets/vcr/calibration

train:
  batch_size: 420 # 500, input batch size
  workers: 8 # number of data loading workers
  epochs: 300000 # number of epochs to train for
  grad_clip: 5.0
  l2_lambda: 0.0 # L2 regul (0 to disable)
  loss: # focal loss
    alpha: 0.25
    gamma: 2.0
    label_smoothing: 0.0
  lr_scheduler:
    patience: 10
    step_size: 1
    gamma: 5.0e-1
  optimizer: 
    name: adam # adadelta or adam or sgd
    adadelta:
      lr: 1.0e-0
      rho: 0.95 # decay rate rho for Adadelta
      eps: 1.0e-8
    adam:
      lr: 1.0e-3
      beta1: 0.9
    sgd:
      lr: 1.0e-3
      momentum: 0.9
      nesterov: True

augment:
  enabled: True
  warp:
    perspective: 0.0 # factor
    scale: [0.5, 2.0] # ratio, e.g. [0.6, 1.4]
    stretch: [[0.5, 2.0], [0.5, 2.0]] # ratio, e.g. [0.6, 1.4]
    rotation: 0.0 # degrees
    shear: [0.0, 0.0] # degrees
    translate: 0.0 # ratio
    flip: 0.5 # probability
    crop: 0.2 # ratio
    random_border_color: False
  texture:
    per_channel: False
    gaussian_blur: [0.0, 2.0] # e.g. [0.0, 2.0]
    multiply: [0.5, 2.0]
    multiply_hue: [-0.8, -1.2] # must not enable
    multiply_saturation: [0.5, 2.0]
    gamma_contrast: [0.5, 2.5]
    additive_gaussian_noise: 5.0
    salt: 0.02
    pepper: 0.02
    grayscale: 0.0 # probability