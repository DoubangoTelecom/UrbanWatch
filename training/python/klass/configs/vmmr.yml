model:
  name: vmmr
  num_classes: 2631
  imgH: 224
  imgW: 224
  imgKar: False # Keep Aspect Ratio
  chroma: rgb # lxy, rgb, gray...
  normalize: [[127.5, 127.5, 127.5], [127.5, 127.5, 127.5]] # [mean, std]
  feat_separator: 
    enabled: True
    margin: 0.25
    scale: 30.0
  projection:
    fully_connected: False
    hidden_channels: 2048
    dropout: 0.2
    activation: "ReLU"
  backbone:
    type: 'mnv4' # 'resnet' or 'mnv4' or 'mnv3' or 'vgg' or 'colornet'
    ResNet:
      input_channels: 3
      width_mult: 1.0
      out_stage: 4 # [1,4]
      activation: ReLU # ReLU, LeakyReLU, GELU, SiLU, Hardswish, Tanh, Identity
    MobileNetV4:
      input_channels: 3
      block_size: "medium" # small, medium, large
      width_mult: 1.0
      out_stage: 5
      activation: "ReLU"
    MobileNetV3:
      input_channels: 3
      block_size: "large"
    Vgg:
      input_channels: 3
      activation: "ReLU"
    ColorNet:
      input_channels: 3
      activation: "ReLU"

datasets:
  train: /home/projects/urban-watch/klass/datasets/vmmr/imgs_train
  val: /home/projects/urban-watch/klass/datasets/vmmr/imgs_val

train:
  batch_size: 190 # 400, input batch size
  workers: 8 # number of data loading workers
  epochs: 300000 # number of epochs to train for
  grad_clip: 5.0
  l2_lambda: 0.0 # L2 regul (0 to disable)
  loss: # focal loss
    alpha: 0.25
    gamma: 2.0
    label_smoothing: 0.0
  lr_scheduler:
    patience: 5 
    step_size: 1
    gamma: 5.0e-1
  optimizer: 
    name: adam # adadelta or adam or sgd
    adadelta:
      lr: 1.0e-0
      rho: 0.95 # decay rate rho for Adadelta
      eps: 1.0e-8
    adam:
      lr: 1.0e-3
      beta1: 0.9
    sgd:
      lr: 1.0e-3
      momentum: 0.9
      nesterov: True

augment:
  enabled: True
  warp:
    perspective: 0.50 # factor
    scale: [0.5, 2.0] # ratio, e.g. [0.6, 1.4]
    stretch: [[0.5, 2.0], [0.5, 2.0]] # ratio, e.g. [0.6, 1.4]
    rotation: 30.0 # degrees
    shear: [10.0, 10.0] # degrees
    translate: 0.2 # ratio
    flip: 0.5 # probability
    crop: 0.2 # ratio
    random_border_color: True
  texture:
    per_channel: True
    gaussian_blur: [0.0, 2.0] # e.g. [0.0, 2.0]
    multiply: [0.5, 1.2]
    multiply_hue: [0.5, 1.2]
    multiply_saturation: [0.5, 1.2]
    gamma_contrast: [0.5, 2.0]
    additive_gaussian_noise: 5.0
    salt: 0.02
    pepper: 0.02
    grayscale: 0.0 # probability