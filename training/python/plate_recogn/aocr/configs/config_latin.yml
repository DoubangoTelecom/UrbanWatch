# Training from scratch:
#   model.stn_type: none -> tps
#   train.opnizer: adam -> adadelta
#   train.loss.type: ce -> ctc
#   augment.enabled: False -> True

model:
  name: anpr_latin
  max_len: 11 # maximum characters in a plate
  alphabet: AF2KL017MN3456GHTUVWXB89CDEYZIJOPQRS
  imgH: 128 # image height
  imgW: 128 # image width
  grayscale: False # grayscale (1 channel) or RGB (3 channels)
  stn_type: none # 'tps' or 'affine' or 'none'
  stn_tps_num_points: 20
  padding: False # whether to keep ratio then pad for image resize
  normalize: [[123.675, 116.28, 103.53], [58.395, 57.12, 57.375]] # [mean, std]
  projection:
    fc: False # Fully Connected?
    dropout: 0.2
  cct: # Compact Transformers
    backbone:
      type: resnet18 # vgg or mnv4 or resnet18
      vgg:
        channels: 256
        activation: ReLU # ReLU, LeakyReLU, GELU, Linear
      resnet18:
        width_mult: 0.75
        out_stage: 3 # [1,4]
        activation: LeakyReLU # ReLU, LeakyReLU, GELU, Linear
      mnv4: # MobileNetV4 backbone
        block_size: large # small, medium, large
        width_mult: 1.0
        out_stage: 3 # [0,5]
        activation: ReLU # ReLU, LeakyReLU, GELU, Linear
    seq_pool: True
    dropout: 0.1 # must be 0, otherwise we get accuracy issue
    attention_dropout: 0.1
    stochastic_depth: 0.1
    num_layers: 4
    num_heads: 1 # multihead (>1) is not npu-friendly
    mlp_ratio: 4.0
    positional_embedding: learnable
    norm_type: dtanh # 'dtanh' (Dynamic Tanh) or 'layer' (layer Norm)
    activation_type: GELU # ReLU, LeakyReLU, GELU, Linear

train:
  dataset: /home/projects/urban-watch/plate_recogn/aocr/datasets/latin/imgs_train # path to training dataset
  batch_size: 420 # input batch size
  workers: 16 # number of data loading workers
  num_iter: 3000000 # number of iterations to train for
  grad_clip: 5.0 # gradient clipping value, set to <=0 to disable
  loss:
    type: ce # ctc  or ce
    alpha: 0.25 # 0.25
    gamma: 2.0 # 2.0
    label_smoothing: 0.02
    blank: 0
  lr_scheduler:
    patience: 2000
    step_size: 1
    gamma: 5.0e-1
  optimizer: 
    name: adam # adadelta or adam or sgd
    adadelta:
      lr: 1.0e-0
      rho: 0.95 # decay rate rho for Adadelta
      eps: 1.0e-8
    adam:
      lr: 1.0e-3
      beta1: 0.9
    sgd:
      lr: 1.0e-3
      momentum: 0.9
      nesterov: True


val:
  dataset: /home/projects/urban-watch/plate_recogn/aocr/datasets/latin/imgs_val # path to validation dataset
  interval: 10 # interval between each validation

augment:
  enabled: True
  warp:
    perspective: 0.25 # factor (must be within [0, 0.5], should be within [0, 0.25])
    scale: [1.0, 1.0] # ratio, e.g. [0.6, 1.4]
    stretch: [[0.8, 1.2], [0.8, 1.2]] # ratio, e.g. [0.6, 1.4]
    rotation: 20.0 # degrees
    shear: [5.0, 5.0] # degrees (x, y)
    translate: 0.1 # ratio
    flip: 0.0 # probability
  texture:
    gaussian_blur: [0.0, 2.0] # e.g. [0.0, 2.0]
    multiply: [0.5, 1.2] # [0.5, 1.2]
    multiply_hue: [0.5, 1.2] # [0.5, 1.2]
    multiply_saturation: [0.5, 1.2] # [0.5, 1.2]
    gamma_contrast: [0.5, 2.0] # [0.5, 2.0]
    additive_gaussian_noise: 5.0 # 5.0
    salt: 0.02 # 0.02
    pepper: 0.02 # 0.02

manualSeed: 1111 # for random seed setting
